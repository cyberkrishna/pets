[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-pet"
version = "0.1.0"
description = "Send events to the Agent Pet desktop companion from any Python agent."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []  # core uses only the standard library

[project.optional-dependencies]
langchain = ["langchain-core>=0.1"]
crewai = ["crewai>=0.1"]

[tool.setuptools]
packages = ["agent_pet"]
